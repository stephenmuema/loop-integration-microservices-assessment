spring:
  datasource:
    url: jdbc:h2:mem:countryinfo;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

# Disable circuit breaker health contribution in tests
management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ncba.countryinfo: INFO
